<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Koshaaru" />
    <title>Koshaaru</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dhivehi_hub_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          }
          var savedLang = localStorage.getItem('dhivehi_hub_lang');
          if (savedLang === 'dv-en') {
            savedLang = 'en';
            localStorage.setItem('dhivehi_hub_lang', 'en');
          }
          document.documentElement.dir = 'ltr';
          document.documentElement.lang = savedLang === 'dv' ? 'dv' : 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#FAF7F2] text-[#142126] antialiased dark:bg-[#0B161A] dark:text-[#F1F5F9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
